{% extends "base.html" %}

{% block title %}
Participants
{% endblock %}

{% block content %}

<h2 class="text-center mb-4">Participants</h2>

<table class="table table-bordered">

<thead class="table-dark">

<tr>

<th>User ID</th>
<th>Booking Date</th>
<th>Status</th>

</tr>

</thead>

<tbody>

{% for booking in bookings %}

<tr>

<td>{{ booking.user_id }}</td>
<td>{{ booking.booking_date }}</td>
<td>{{ booking.status }}</td>

</tr>

{% endfor %}

</tbody>

</table>

{% endblock %}
