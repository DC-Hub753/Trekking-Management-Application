{% extends "base.html" %}

{% block title %}
Edit Profile
{% endblock %}

{% block content %}

<div class="col-md-6 mx-auto">

    <div class="card shadow">

        <div class="card-header bg-dark text-white text-center">

            <h3>Edit Profile</h3>

        </div>

        <div class="card-body">

            <form method="POST">

                <div class="mb-3">

                    <label>Name</label>

                    <input
                        type="text"
                        name="name"
                        class="form-control"
                        value="{{ staff.name }}"
                        required>

                </div>

                <div class="mb-3">

                    <label>Email</label>

                    <input
                        type="email"
                        name="email"
                        class="form-control"
                        value="{{ staff.email }}"
                        required>

                </div>

                <div class="mb-3">

                    <label>Phone</label>

                    <input
                        type="text"
                        name="phone"
                        class="form-control"
                        value="{{ staff.phone or '' }}">

                </div>

                <button
                    type="submit"
                    class="btn btn-success w-100">

                    Save Changes

                </button>

            </form>

        </div>

    </div>

</div>

{% endblock %}
