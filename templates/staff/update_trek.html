{% extends "base.html" %}

{% block title %}
Update Trek
{% endblock %}

{% block content %}

<h2 class="text-center mb-4">Update Trek</h2>

<form method="POST">

<div class="mb-3">

<label>Available Slots</label>

<input
type="number"
name="slots"
class="form-control"
value="{{ trek.slots }}"
required>

</div>

<div class="mb-3">

<label>Status</label>

<select
name="status"
class="form-control">

<option {% if trek.status=="Open" %}selected{% endif %}>Open</option>

<option {% if trek.status=="Closed" %}selected{% endif %}>Closed</option>

<option {% if trek.status=="Completed" %}selected{% endif %}>Completed</option>

</select>

</div>

<button class="btn btn-success">

Update

</button>

</form>

{% endblock %}
