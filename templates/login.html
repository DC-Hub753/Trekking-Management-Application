{% extends "base.html" %}

{% block title %}
Login
{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-5">

        <div class="card shadow">

            <div class="card-header bg-dark text-white text-center">

                <h3>Login</h3>

            </div>

            <div class="card-body">

                <form method="POST">

                    <div class="mb-3">

                        <label>Email / Username</label>

                        <input
                            type="text"
                            name="email"
                            class="form-control"
                            required>

                    </div>

                    <div class="mb-3">

                        <label>Password</label>

                        <input
                            type="password"
                            name="password"
                            id="password"
                            class="form-control"
                            required>

                        <div class="form-check mt-2">
                            <input
                                type="checkbox"
                                class="form-check-input"
                                id="showPassword"
                                onclick="password.type = this.checked ? 'text' : 'password'">

                            <label class="form-check-label" for="showPassword">
                                Show Password
                            </label>
                        </div>

                    </div>

                    <button class="btn btn-primary w-100">

                        Login

                    </button>

                </form>

                <div class="text-center mt-3">

                    <p class="mb-2">Don't have an account?</p>

                    <a href="{{ url_for('register_user') }}"
                    class="btn btn-success btn-sm me-2">
                        Register as User
                    </a>

                    <a href="{{ url_for('register_staff') }}"
                    class="btn btn-warning btn-sm">
                        Register as Staff
                    </a>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
